<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DarkAngel | FallenAngels</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@400;600&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="musik.css">

</head>

<body>

<div class="seite">

    <!-- Banner -->

    <img src="banner.png"
         class="banner"
         alt="FallenAngels">


    <!-- Titel -->

    <h1 class="album-titel">
        DarkAngel
    </h1>


    <!-- Beschreibung -->

    <p class="text">

        Eine Reise zwischen Licht und Schatten.

    </p>


    <!-- Cover -->

    <div class="album-seite">

        <img src="darkangel-cover.png"
             class="cover"
             alt="DarkAngel Cover">


        <!-- MP3 -->

      <div class="musik-player">

    <h2 id="song-title">Ashes in My Heart</h2>

    <div id="song-status">Bereit</div>

    <audio id="audio-player"></audio>

    <div class="player-controls">

        <button id="previous" type="button">|◀</button>

        <button id="play" type="button">▶</button>

        <button id="next" type="button">▶|</button>

    </div>

    <div class="progress-area">

        <span id="current-time">0:00</span>

        <input
            type="range"
            id="progress"
            min="0"
            max="100"
            value="0"
        >

        <span id="duration">0:00</span>

    </div>

    <div class="volume-area">

        🔊

        <input
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
        >

    </div>

    <div id="playlist"></div>

</div>

        <!-- YouTube -->

        <div class="musik-link">

            <h2>YouTube</h2>

            <a href="#"
               target="_blank"
               rel="noopener">

                ▶ Auf YouTube anhören

            </a>

        </div>


        <!-- SoundCloud -->

        <div class="musik-link">

            <h2>SoundCloud</h2>

            <a href="#"
               target="_blank"
               rel="noopener">

                ♪ Auf SoundCloud anhören

            </a>

        </div>

    </div>


    <!-- Zurück -->

    <a href="musik.html"
       class="button">

        ⬅ Zurück zur Musik

    </a>

</div>
<script src="musik.js"></script>
</body>

</html>
