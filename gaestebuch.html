<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gästebuch | FallenAngels</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="seite">

    <img src="banner.png"
         class="banner"
         alt="FallenAngels">

    <h1>Gästebuch</h1>

    <p class="text">
        Hinterlasst uns ein paar Worte.
    </p>


    <div class="gaestebuch-bereich">

        <h2>Eintrag hinterlassen</h2>

        <form>

            <input
                type="text"
                name="name"
                placeholder="Dein Name"
                required
            >

            <textarea
                name="nachricht"
                placeholder="Deine Nachricht"
                rows="6"
                required
            ></textarea>

            <button type="submit">
                Eintrag senden
            </button>

        </form>

    </div>


    <a href="index.html"
       class="button">

        ⬅ Zurück zur Startseite

    </a>

</div>

</body>

</html>
