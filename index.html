<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FallenAngels</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<main>

    <!-- ========================= -->
    <!-- Homepage -->
    <!-- ========================= -->

    <div class="homepage-container">

        <img src="homepage.png"
             class="homepage"
             alt="FallenAngels">

        <a href="musik.html"
           class="link musik"
           title="Musik"></a>

        <a href="ueber-uns.html"
           class="link ueberuns"
           title="Über uns"></a>

        <a href="galerie.html"
           class="link galerie"
           title="Galerie"></a>

        <a href="gaestebuch.html"
           class="link gaestebuch"
           title="Gästebuch"></a>

    </div>



    <!-- ========================= -->
    <!-- Besucherbereich -->
    <!-- ========================= -->

    <section class="visitor-area">

        <img src="FA-Logo.png"
             alt="FallenAngels Logo"
             class="fa-logo">


        <div class="grave-container">

            <img src="Grabstein.png"
                 alt="Besucher der verlorenen Seelen"
                 class="grave">


            <div class="visitor-number">

                000000

            </div>

        </div>

    </section>



    <!-- ========================= -->
    <!-- Footer -->
    <!-- ========================= -->

    <footer>

        <p>

            © 2026 FallenAngels

        </p>

    </footer>

</main>
<script
    src="https://page-views-api.ratneshc.com/script"
    data-site="noctisnexus.github.io"
    data-path="/FallenAngels/"
    defer>
</script>
    <script>

document.addEventListener("DOMContentLoaded", function(){

    setTimeout(function(){

        fetch("https://page-views-api.ratneshc.com/api/v1/views?site=noctisnexus.github.io&path=/FallenAngels/")
        
        .then(response => response.json())

        .then(data => {

            const counter = document.querySelector(".visitor-number");

            if(counter && typeof data.views === "number"){

                counter.textContent =
                    String(data.views).padStart(6, "0");

            }

        })

        .catch(error => {

            console.log("Besucherzähler konnte nicht geladen werden.");

        });

    }, 500);

});

</script>
</body>

</html>
