<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Windows in Black | FallenAngels</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@400;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="musik.css">

</head>

<body>

<div class="seite">

    <!-- Banner -->

    <img src="banner.png"
         class="banner"
         alt="FallenAngels">


    <!-- Titel -->

    <h1 class="album-titel">
        Windows in Black
    </h1>


    <!-- Beschreibung -->

    <p class="text">
        Zwischen Dunkelheit, Erinnerungen und Emotionen.
    </p>


    <!-- Cover -->

    <div class="album-seite">

        <img src="windows-in-black-cover.png"
             class="cover"
             alt="Windows in Black Cover">


        <!-- =====================================
             WINDOWS IN BLACK PLAYER
             ===================================== -->

        <div class="musik-player">

            <h2>
                Windows in Black hören
            </h2>


            <div class="song-info">

                <div class="song-title"
                     id="windows-song-title">
                    Remember
                </div>

                <div class="song-status"
                     id="windows-song-status">
                    Bereit
                </div>

            </div>


            <audio id="windows-audio"
                   preload="metadata">
            </audio>


            <!-- Fortschritt -->

            <div class="progress-area">

                <span id="windows-current-time">
                    0:00
                </span>

                <input
                    type="range"
                    id="windows-progress"
                    min="0"
                    max="100"
                    value="0">

                <span id="windows-duration">
                    0:00
                </span>

            </div>


            <!-- Steuerung -->

            <div class="player-controls">

                <button
                    type="button"
                    id="windows-previous"
                    aria-label="Vorheriger Titel">
                    ⏮
                </button>

                <button
                    type="button"
                    id="windows-play"
                    class="play-button"
                    aria-label="Wiedergabe">
                    ▶
                </button>

                <button
                    type="button"
                    id="windows-next"
                    aria-label="Nächster Titel">
                    ⏭
                </button>

            </div>


            <!-- Lautstärke -->

            <div class="volume-area">

                <span>🔊</span>

                <input
                    type="range"
                    id="windows-volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.8">

            </div>


            <!-- PLAYLIST -->

            <div class="playlist">

                <h2>
                    Playlist
                </h2>

                <div id="windows-playlist"></div>

            </div>

        </div>


        <!-- YouTube -->

        <div class="musik-link">

            <h2>YouTube</h2>

            <a href="#"
               target="_blank"
               rel="noopener">

                ▶ Auf YouTube anhören

            </a>

        </div>


        <!-- SoundCloud -->

        <div class="musik-link">

            <h2>SoundCloud</h2>

            <a href="#"
               target="_blank"
               rel="noopener">

                ♪ Auf SoundCloud anhören

            </a>

        </div>

    </div>


    <!-- Zurück -->

    <a href="musik.html"
       class="button">

        ⬅ Zurück zur Musik

    </a>

</div>


<!-- Windows-in-Black-Player -->

<script src="windows-in-black.js"></script>

</body>

</html>
